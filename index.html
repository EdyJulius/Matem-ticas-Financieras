<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calfin - Calculadora Financiera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #f0f2f5; --bg-card: #ffffff; --text-primary: #1a1a2e;
            --text-secondary: #4a4a68; --accent: #4361ee; --accent-hover: #3651d4;
            --border: #e0e0e8; --input-bg: #f8f9fc; --success: #10b981;
            --error: #ef4444; --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        [data-theme="dark"] {
            --bg-primary: #0f0f1a; --bg-card: #1a1a2e; --text-primary: #f0f0f8;
            --text-secondary: #a0a0b8; --accent: #6366f1; --accent-hover: #818cf8;
            --border: #2a2a3e; --input-bg: #252540; --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: flex-start; padding: 30px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            background: var(--bg-card); border-radius: 20px; box-shadow: var(--shadow);
            padding: 40px; width: 100%; max-width: 720px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { font-size: 1.75rem; font-weight: 700; }
        .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 30px; }
        .theme-toggle {
            background: var(--input-bg); border: 2px solid var(--border);
            border-radius: 50px; width: 60px; height: 30px; cursor: pointer;
            position: relative; transition: all 0.3s ease; flex-shrink: 0;
        }
        .theme-toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 22px; height: 22px; background: var(--accent);
            border-radius: 50%; transition: transform 0.3s ease;
        }
        [data-theme="dark"] .theme-toggle::after { transform: translateX(30px); }
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
        input, textarea {
            width: 100%; padding: 14px 18px; border: 2px solid var(--border);
            border-radius: 12px; font-size: 1rem; background: var(--input-bg);
            color: var(--text-primary); transition: all 0.3s ease;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1); }
        #expression {
            font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace;
            font-size: 1.1rem; line-height: 1.6; resize: none; overflow-y: hidden;
            min-height: 88px; word-break: break-all;
        }
        .palette { display: flex; flex-wrap: wrap; gap: 8px; }
        .palette button {
            padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px;
            font-size: 0.9rem; font-weight: 600; font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace;
            background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all 0.2s ease;
        }
        .palette button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
        .palette button.factor-btn { color: var(--accent); }
        .palette button.factor-btn:hover { background: var(--accent); color: #ffffff; }
        .palette button.op-btn { min-width: 44px; color: var(--success); }
        .palette button.del-btn { color: var(--error); }
        .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 6px; }
        .buttons button { padding: 16px 24px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-calculate { background: var(--accent); color: white; }
        .btn-calculate:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(67, 97, 238, 0.3); }
        .btn-clear { background: var(--input-bg); color: var(--text-secondary); border: 2px solid var(--border); }
        .btn-clear:hover { background: var(--border); transform: translateY(-2px); }
        .results { margin-top: 30px; padding: 24px; background: var(--input-bg); border-radius: 12px; border: 2px solid var(--border); display: none; }
        .results.show { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-item { margin-bottom: 16px; }
        .result-item:last-child { margin-bottom: 0; }
        .result-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
        .result-label-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
        .result-label-row .result-label { margin-bottom: 0; }
        .currency-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; user-select: none; margin-bottom: 0; }
        .currency-toggle input { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); cursor: pointer; }
        .result-value { font-size: 1.05rem; font-weight: 700; font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace; word-break: break-all; line-height: 1.5; }
        .result-value.highlight { color: var(--accent); font-size: 1.6rem; }
        .breakdown-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .breakdown-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); padding: 8px 10px; border-bottom: 2px solid var(--border); }
        .breakdown-table td { padding: 9px 10px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
        .breakdown-table tr:last-child td { border-bottom: none; }
        .breakdown-table .mono { font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace; }
        .breakdown-table .factor-name { color: var(--accent); font-weight: 600; }
        .breakdown-table .factor-value { color: var(--success); font-weight: 600; }
        .error-message { color: var(--error); font-size: 0.85rem; margin-top: 8px; display: none; }
        .error-message.show { display: block; }
        input.error, textarea.error { border-color: var(--error); }
        dialog { background: var(--bg-card); color: var(--text-primary); border: 2px solid var(--border); border-radius: 16px; padding: 28px; width: min(92vw, 360px); box-shadow: var(--shadow); }
        dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
        dialog h3 { font-size: 1.15rem; margin-bottom: 4px; }
        dialog h3 span { font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace; color: var(--accent); }
        dialog .desc { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 12px; }
        dialog label { margin-top: 14px; }
        .dialog-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
        .dialog-btns button { padding: 13px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CALFIN - MATFIN</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button>
        </div>
        <p class="subtitle">Escribir factores y magnitudes; magnitudes sin puntos ni comas (.) o (,)</p>

        <form id="calculatorForm">
            <div class="form-group">
                <label for="expression">Ecuación de valor</label>
                <textarea id="expression" rows="3" spellcheck="false" autocomplete="off"
                       placeholder="e.g. 10000 * [(P/A,3%,10)+(P/F,1%,13)]"></textarea>
                <div class="error-message" id="exprError"></div>
            </div>

            <div class="form-group">
                <label>Insertar factores estándar</label>
                <div class="palette" id="factorPalette">
                    <button type="button" class="factor-btn" data-factor="P/F" data-args="2">(P/F,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="F/P" data-args="2">(F/P,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="P/A" data-args="2">(P/A,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="F/A" data-args="2">(F/A,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="A/P" data-args="2">(A/P,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="A/F" data-args="2">(A/F,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="P/G" data-args="2">(P/G,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="A/G" data-args="2">(A/G,i,n)</button>
                    <button type="button" class="factor-btn" data-factor="P/g" data-args="3">(P/g,i,g,n)</button>
                </div>
            </div>

            <div class="form-group">
                <label>Operadores aritméticos</label>
                <div class="palette">
                    <button type="button" class="op-btn" data-insert=" + ">+</button>
                    <button type="button" class="op-btn" data-insert=" - ">&minus;</button>
                    <button type="button" class="op-btn" data-insert=" * ">&times;</button>
                    <button type="button" class="op-btn" data-insert=" / ">&divide;</button>
                    <button type="button" class="op-btn" data-insert="[">[</button>
                    <button type="button" class="op-btn" data-insert="]">]</button>
                    <button type="button" class="op-btn" data-insert="(">(</button>
                    <button type="button" class="op-btn" data-insert="\)">\)</button>
                    <button type="button" id="backspaceBtn">&#9003; Borrar</button>
                </div>
            </div>

            <div class="buttons">
                <button type="button" class="btn-calculate" id="calculateBtn">Calcular</button>
                <button type="button" class="btn-clear" id="clearBtn">Limpiar</button>
            </div>
        </form>

        <div class="results" id="results">
            <div class="result-item">
                <div class="result-label-row">
                    <div class="result-label">Resultado Final</div>
                    <label class="currency-toggle">
                        <input type="checkbox" id="currencyToggle">
                        Formato $
                    </label>
                </div>
                <div class="result-value highlight" id="resultCalculated">-</div>
            </div>
            <div class="result-item" id="substitutionItem">
                <div class="result-label">Evaluación numérica</div>
                <div class="result-value" id="resultSubstituted" style="font-size:0.9rem; font-weight:400;">-</div>
            </div>

            <div class="result-item" id="breakdownItem" style="display:none;">
                <div class="result-label">Desglose de factores</div>
                <table class="breakdown-table">
                    <thead>
                        <tr>
                            <th>Factor Numérico</th>
                            <th>Fórmula / Descripción</th>
                            <th>Valor (12 Decimales)</th>
                        </tr>
                    </thead>
                    <tbody id="breakdownBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <dialog id="factorDialog">
        <h3>Insertar <span id="dlgFactorName"></span></h3>
        <p class="desc" id="dlgFactorDesc"></p>
        
        <label for="dlgRate">Tasa de interés (i) &mdash; e.g., 3 o 0.03</label>
        <input type="number" id="dlgRate" step="any" min="0" placeholder="e.g., 3">
        
        <div id="dlgGRateContainer" style="display: none;">
            <label for="dlgGRate">Tasa del gradiente (g) &mdash; e.g., 2 o 0.02</label>
            <input type="number" id="dlgGRate" step="any" min="0" placeholder="e.g., 2">
        </div>

        <label for="dlgPeriods">Periodos (n)</label>
        <input type="number" id="dlgPeriods" step="any" min="0" placeholder="e.g., 10">
        
        <div class="dialog-btns">
            <button type="button" class="btn-clear" id="dlgCancel">Cancelar</button>
            <button type="button" class="btn-calculate" id="dlgInsert">Insertar</button>
        </div>
    </dialog>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        });

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.setAttribute('data-theme', 'dark');
        }

        const FACTORS = {
            'P/F': { desc: 'Presente dado Futuro', args: 2, fn: (i, n) => i === 0 ? 1 : Math.pow(1 + i, -n) },
            'F/P': { desc: 'Futuro dado Presente', args: 2, fn: (i, n) => i === 0 ? 1 : Math.pow(1 + i, n) },
            'P/A': { desc: 'Presente dado Anualidad', args: 2, fn: (i, n) => i === 0 ? n : (Math.pow(1 + i, n) - 1) / (i * Math.pow(1 + i, n)) },
            'F/A': { desc: 'Futuro dado Anualidad', args: 2, fn: (i, n) => i === 0 ? n : (Math.pow(1 + i, n) - 1) / i },
            'A/P': { desc: 'Recuperación de Capital (A/P)', args: 2, fn: (i, n) => i === 0 ? 1/n : (i * Math.pow(1 + i, n)) / (Math.pow(1 + i, n) - 1) },
            'A/F': { desc: 'Fondo de Amortización (A/F)', args: 2, fn: (i, n) => i === 0 ? 1/n : i / (Math.pow(1 + i, n) - 1) },
            'P/G': { desc: 'Presente dado Gradiente Aritmético', args: 2, fn: (i, n) => i === 0 ? n * (n - 1) / 2 : (Math.pow(1 + i, n) - i * n - 1) / (i * i * Math.pow(1 + i, n)) },
            'A/G': { desc: 'Anualidad dado Gradiente Aritmético', args: 2, fn: (i, n) => i === 0 ? (n - 1) / 2 : (1 / i) - (n / (Math.pow(1 + i, n) - 1)) },
            'P/g': { desc: 'Presente dado Gradiente Geométrico', args: 3, fn: (i, g, n) => i === g ? n / (1 + i) : (1 - Math.pow(1 + g, n) * Math.pow(1 + i, -n)) / (i - g) }
        };

        const FACTOR_RE = /\(\s*([A-Za-z]\/[A-Za-z])\s*,([^)]+)\)/g;

        function substituteFactors(expr, breakdown) {
            return expr.replace(FACTOR_RE, (match, factorName, argsStr) => {
                const nameStr = factorName;
                const factor = FACTORS[nameStr] || FACTORS[nameStr.toUpperCase()];
                if (!factor) throw new Error(`Factor desconocido: (${factorName}, ...)`);

                const argsRaw = argsStr.split(/[,;]/).map(s => s.trim());
                if (argsRaw.length !== factor.args) throw new Error(`El factor (${factorName}) requiere ${factor.args} parámetros.`);

                const parseRate = (str) => {
                    let val = parseFloat(str);
                    if (str.includes('%') || val >= 1) val = val / 100;
                    return { value: val, shown: str };
                };

                let valResult, argsDisplay;
                if (factor.args === 2) {
                    const i = parseRate(argsRaw[0]);
                    const n = parseFloat(argsRaw[1]);
                    valResult = factor.fn(i.value, n);
                    argsDisplay = `${i.shown}, ${n}`;
                } else if (factor.args === 3) {
                    const i = parseRate(argsRaw[0]);
                    const g = parseRate(argsRaw[1]);
                    const n = parseFloat(argsRaw[2]);
                    valResult = factor.fn(i.value, g.value, n);
                    argsDisplay = `${i.shown}, ${g.shown}, ${n}`;
                }

                if (!isFinite(valResult)) throw new Error(`El factor ${match} es indefinido.`);

                breakdown.push({ name: factorName, argsShown: argsDisplay, desc: factor.desc, value: valResult });
                return '(' + valResult + ')';
            });
        }

        function evaluate(src) {
            let pos = 0;
            const peek = () => src[pos];
            const skipWs = () => { while (pos < src.length && /\s/.test(src[pos])) pos++; };

            function parseExpression() {
                let left = parseTerm();
                skipWs();
                while (peek() === '+' || peek() === '-') {
                    const op = src[pos++];
                    const right = parseTerm();
                    left = op === '+' ? left + right : left - right;
                    skipWs();
                }
                return left;
            }
            function parseTerm() {
                let left = parsePower();
                skipWs();
                while (peek() === '*' || peek() === '/') {
                    const op = src[pos++];
                    const right = parsePower();
                    if (op === '/' && right === 0) throw new Error('División por cero');
                    left = op === '*' ? left * right : left / right;
                    skipWs();
                }
                return left;
            }
            function parsePower() {
                const base = parseUnary();
                skipWs();
                if (peek() === '^') { pos++; return Math.pow(base, parsePower()); }
                return base;
            }
            function parseUnary() {
                skipWs();
                if (peek() === '-') { pos++; return -parseUnary(); }
                if (peek() === '+') { pos++; return parseUnary(); }
                return parsePrimary();
            }
            function parsePrimary() {
                skipWs();
                if (peek() === '(') {
                    pos++;
                    const v = parseExpression();
                    skipWs();
                    if (peek() !== ')') throw new Error('Falta un paréntesis de cierre');
                    pos++;
                    return v;
                }
                const m = /^[0-9]*\.?[0-9]+(?:e[+-]?[0-9]+)?/i.exec(src.slice(pos));
                if (!m) throw new Error(`Carácter inesperado: '${src[pos] || 'fin de entrada'}'`);
                pos += m[0].length;
                return parseFloat(m[0]);
            }

            const result = parseExpression();
            skipWs();
            if (pos < src.length) throw new Error(`Carácter inesperado: '${src[pos]}'`);
            return result;
        }

        const exprInput = document.getElementById('expression');
        const exprError = document.getElementById('exprError');
        const results = document.getElementById('results');
        const resultCalculated = document.getElementById('resultCalculated');
        const resultSubstituted = document.getElementById('resultSubstituted');
        const breakdownItem = document.getElementById('breakdownItem');
        const breakdownBody = document.getElementById('breakdownBody');
        const calculateBtn = document.getElementById('calculateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const currencyToggle = document.getElementById('currencyToggle');

        if (!exprInput) return;

        function fmt(x, precision) {
            if (Number.isInteger(x) && Math.abs(x) < 1e15) return x.toString();
            return x.toFixed(precision);
        }

        let lastValue = null;

        function renderResult() {
            if (lastValue === null) return;
            resultCalculated.textContent = currencyToggle.checked
                ? new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(lastValue)
                : fmt(lastValue, 12); // Incrementada la precisión
        }

        currencyToggle.addEventListener('change', renderResult);

        function autoGrow() {
            exprInput.style.height = 'auto';
            exprInput.style.height = Math.max(exprInput.scrollHeight, 88) + 'px';
        }
        autoGrow();

        function clearErrors() {
            exprError.classList.remove('show');
            exprInput.classList.remove('error');
        }

        function calculate() {
            clearErrors();
            const raw = exprInput.value.trim();
            if (!raw) {
                exprInput.classList.add('error');
                exprError.textContent = 'Ingrese una ecuación';
                exprError.classList.add('show');
                results.classList.remove('show');
                return;
            }

            try {
                const normalized = raw
                    .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')')
                    .replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/−/g, '-');

                const breakdown = [];
                const substituted = substituteFactors(normalized, breakdown);
                const value = evaluate(substituted);

                lastValue = value;
                renderResult();

                if (breakdown.length > 0) {
                    let idx = 0;
                    const shown = normalized.replace(FACTOR_RE, () => '(' + fmt(breakdown[idx++].value, 8) + ')');
                    resultSubstituted.textContent = '= ' + shown;
                    resultSubstituted.parentElement.style.display = '';
                    
                    breakdownItem.style.display = 'block';
                    breakdownBody.innerHTML = '';
                    for (const f of breakdown) {
                        const tr = document.createElement('tr');
                        const cells = [
                            ['mono factor-name', `(${f.name}, ${f.argsShown})`],
                            ['formula', f.desc],
                            ['mono factor-value', fmt(f.value, 12)]
                        ];
                        for (const [cls, text] of cells) {
                            const td = document.createElement('td');
                            td.className = cls;
                            td.textContent = text;
                            tr.appendChild(td);
                        }
                        breakdownBody.appendChild(tr);
                    }
                } else {
                    resultSubstituted.parentElement.style.display = 'none';
                    breakdownItem.style.display = 'none';
                }
                results.classList.add('show');
            } catch (e) {
                exprInput.classList.add('error');
                exprError.textContent = e.message;
                exprError.classList.add('show');
                results.classList.remove('show');
            }
        }

        function insertAtCursor(text) {
            const start = exprInput.selectionStart ?? exprInput.value.length;
            const end = exprInput.selectionEnd ?? exprInput.value.length;
            exprInput.value = exprInput.value.slice(0, start) + text + exprInput.value.slice(end);
            const cursor = start + text.length;
            exprInput.focus();
            exprInput.setSelectionRange(cursor, cursor);
            autoGrow();
            clearErrors();
        }

        document.querySelectorAll('[data-insert]').forEach(btn =>
            btn.addEventListener('click', () => insertAtCursor(btn.dataset.insert)));

        document.getElementById('backspaceBtn').addEventListener('click', () => {
            const start = exprInput.selectionStart ?? exprInput.value.length;
            const end = exprInput.selectionEnd ?? exprInput.value.length;
            if (start !== end) {
                exprInput.value = exprInput.value.slice(0, start) + exprInput.value.slice(end);
                exprInput.setSelectionRange(start, start);
            } else if (start > 0) {
                exprInput.value = exprInput.value.slice(0, start - 1) + exprInput.value.slice(start);
                exprInput.setSelectionRange(start - 1, start - 1);
            }
            exprInput.focus();
            autoGrow();
            clearErrors();
        });

        const dialog = document.getElementById('factorDialog');
        const dlgRate = document.getElementById('dlgRate');
        const dlgGRate = document.getElementById('dlgGRate');
        const dlgPeriods = document.getElementById('dlgPeriods');
        const dlgGRateContainer = document.getElementById('dlgGRateContainer');
        let pendingFactor = null;
        let pendingFactorArgs = 2;

        document.querySelectorAll('.factor-btn').forEach(btn =>
            btn.addEventListener('click', () => {
                pendingFactor = btn.dataset.factor;
                pendingFactorArgs = parseInt(btn.dataset.args);
                
                document.getElementById('dlgFactorName').textContent = `(${pendingFactor}, ${pendingFactorArgs === 3 ? 'i, g, n' : 'i, n'})`;
                document.getElementById('dlgFactorDesc').textContent = FACTORS[pendingFactor].desc;
                
                dlgRate.value = '';
                dlgGRate.value = '';
                dlgPeriods.value = '';
                dlgGRateContainer.style.display = pendingFactorArgs === 3 ? 'block' : 'none';
                
                dialog.showModal();
                dlgRate.focus();
            }));

        document.getElementById('dlgCancel').addEventListener('click', () => dialog.close());

        function commitFactor() {
            const rate = dlgRate.value.trim();
            const gRate = dlgGRate.value.trim();
            const n = dlgPeriods.value.trim();
            
            if (!rate || !n || (pendingFactorArgs === 3 && !gRate)) {
                dlgRate.focus();
                return;
            }
            
            const formatRate = (r) => parseFloat(r) < 1 ? r : r + '%';
            
            let insertedText = '';
            if (pendingFactorArgs === 2) {
                insertedText = `(${pendingFactor},${formatRate(rate)},${n})`;
            } else {
                insertedText = `(${pendingFactor},${formatRate(rate)},${formatRate(gRate)},${n})`;
            }
            
            dialog.close();
            insertAtCursor(insertedText);
        }

        document.getElementById('dlgInsert').addEventListener('click', commitFactor);
        dialog.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); commitFactor(); }
        });

        calculateBtn.addEventListener('click', calculate);
        clearBtn.addEventListener('click', () => {
            exprInput.value = ''; results.classList.remove('show');
            lastValue = null; clearErrors(); autoGrow(); exprInput.focus();
        });

        exprInput.addEventListener('input', () => {
            autoGrow(); clearErrors();
            if (results.classList.contains('show')) calculate();
        });

        document.getElementById('calculatorForm').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); calculate(); }
        });
    });
    </script>
</body>
</html>
